<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Owner · Philine’s Picture Book</title>
    <link rel="stylesheet" href="../assets/css/site.css">
    <script defer src="../assets/js/owner.js"></script>
  </head>
  <body>
    <main class="owner-entry">
      <section class="paper">
        <h1>My corner</h1>
        <p id="owner-status" role="status" aria-live="polite">Checking this browser…</p>
        <form id="owner-login" hidden>
          <label>Owner login<input name="login" autocomplete="username" required maxlength="64"></label>
          <label>Password<input name="password" type="password" autocomplete="current-password" required maxlength="1024"></label>
          <button type="submit" class="primary">Open my notebook</button>
        </form>
        <p><a href="index.html">Return to the picture book</a></p>
      </section>
    </main>
  </body>
</html>
