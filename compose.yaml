services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: picturebook
      POSTGRES_USER: picturebook_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - picturebook_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U picturebook_admin -d picturebook"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  picturebook_postgres:
