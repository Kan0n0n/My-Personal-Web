<!-- Shared, editable HTML for repeated records and modal forms.
     The page layouts themselves live in pages/*.html.
     Keep template IDs, data-field attributes, input names, and data-action hooks. -->

<template id="entry-template">
  <article class="paper entry">
    <span class="date" data-field="date"></span>
    <h3 data-field="title"></h3>
    <p data-field="body"></p>
    <div class="entry-footer">
      <span data-field="tags"></span>
      <button hidden data-owner-only class="small" data-action="edit">Edit page</button>
    </div>
  </article>
</template>

<template id="document-template">
  <article class="paper">
    <span class="tag" data-field="folder"></span>
    <h3 class="record-heading" data-field="title"></h3>
    <p class="help" data-field="note"></p>
    <a class="button" data-document-link target="_blank" rel="noopener noreferrer">Open material ↗</a>
    <button hidden data-owner-only class="small" data-action="edit" data-key="documents">Edit</button>
  </article>
</template>

<template id="task-template">
  <article class="paper task">
    <strong data-field="title"></strong>
    <p data-field="note"></p>
    <small data-field="due"></small>
    <label>Move to
      <select data-task>
        <option>To do</option>
        <option>In progress</option>
        <option>Done</option>
      </select>
    </label>
    <button hidden data-owner-only class="small" data-action="edit" data-key="tasks">Edit task</button>
  </article>
</template>

<template id="anime-template">
  <article class="paper">
    <span class="tag" data-field="status"></span>
    <h3 class="record-heading" data-field="title"></h3>
    <p class="rating" data-field="rating"></p>
    <p class="help" data-field="episodes"></p>
    <details>
      <summary data-field="spoiler-label">My thoughts</summary>
      <p class="long-text" data-field="body"></p>
    </details>
    <div class="entry-footer">
      <small data-field="date"></small>
      <button hidden data-owner-only class="small" data-action="edit" data-key="anime">Edit log</button>
    </div>
  </article>
</template>

<template id="version-template">
  <article class="paper">
    <span class="eyebrow" data-field="version-date"></span>
    <h3 data-field="title"></h3>
    <ul data-changes></ul>
    <a data-version-link>Read the version notes ↗</a>
  </article>
</template>

<template id="book-template">
  <div class="book-shelf-item">
    <button class="book-button" data-action="read-book">
      <span data-field="title"></span>
      <small class="block" data-field="progress"></small>
    </button>
  </div>
</template>

<template id="reader-template">
  <div>
    <div class="reader-tools">
      <button hidden data-owner-only class="small" data-action="bookmark">Keep my place</button>
      <div>
        <button hidden data-owner-only class="small" data-action="font-down" aria-label="Smaller text">A−</button>
        <button hidden data-owner-only class="small" data-action="font-up" aria-label="Larger text">A+</button>
        <button hidden data-owner-only class="small" data-action="reader-theme">Light / dark</button>
        <label class="reader-font-label">Novel font
          <select id="reader-font" aria-label="Novel text font">
            <option value="georgia">Georgia</option>
            <option value="overlock">Overlock</option>
            <option value="palatino">Palatino</option>
            <option value="arial">Arial</option>
            <option value="verdana">Verdana</option>
            <option value="monospace">Monospace</option>
          </select>
        </label>
        <label class="reader-font-label">Alignment
          <select id="reader-alignment" aria-label="Novel text alignment">
            <option value="left">Left</option><option value="center">Center</option><option value="right">Right</option><option value="justify">Justify</option>
          </select>
        </label>
      </div>
    </div>
    <h3 data-field="title"></h3>
    <p class="help" id="bookmark-status">Make yourself comfortable.</p>
    <p class="help" id="autosave-status" role="status">Your reading position saves automatically.</p>
    <section class="reader-speech" aria-label="Read novel aloud">
      <div class="speech-controls">
        <button type="button" id="speech-play">▶ Read aloud</button>
        <button type="button" id="speech-pause" disabled>Pause</button>
        <button type="button" id="speech-stop" disabled>Stop</button>
        <label>Device voice<select id="speech-voice" aria-label="Read-aloud voice"></select></label>
        <label>Speed<select id="speech-rate" aria-label="Read-aloud speed"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="1.75">1.75×</option><option value="2">2×</option></select></label>
        <label class="speech-follow"><input type="checkbox" id="speech-follow" checked> Follow voice</label>
      </div>
      <p class="help" id="speech-status" role="status">Choose a device voice. Select a sentence or start from your visible position.</p>
      <div id="speech-highlight-layer" aria-hidden="true"></div>
    </section>
    <div class="reader-navigation" id="format-navigation" hidden>
      <button type="button" class="small" id="reader-prev">← Previous</button>
      <label>Title - Page<select id="reader-section" aria-label="Title and page"></select></label>
      <button type="button" class="small" id="reader-next">Next →</button>
    </div>
    <div class="reader-text" data-field="text"></div>
    <nav class="reader-navigation reader-navigation-bottom" id="format-navigation-bottom" aria-label="Continue reading" hidden>
      <button type="button" class="small" id="reader-prev-bottom">← Previous chapter</button>
      <span class="help" id="reader-section-bottom" aria-live="polite"></span>
      <button type="button" class="small" id="reader-next-bottom">Next chapter →</button>
      <button type="button" class="small" id="reader-next-title" hidden>Next title ⇥</button>
    </nav>
    <div class="record-spacing">
      <button hidden data-owner-only class="small" data-action="move-book">Edit title / folder</button>
      <a id="book-download" class="button small" hidden>Download original</a>
      <button hidden data-owner-only class="small" data-action="remove-book">Remove from shelf</button>
    </div>
  </div>
</template>

<template id="folder-fields">
  <div><label>Series / folder name<input name="title" required maxlength="500" placeholder="e.g. Ascendance of a Bookworm"></label></div>
</template>
<template id="book-folder-fields">
  <div>
    <label>Volume title<input name="title" required maxlength="500"></label>
    <label>Series folder<select name="folderId" id="book-folder-choice"><option value="">Unfiled books</option></select></label>
  </div>
</template>

<!-- Empty lists: change these messages here instead of in JavaScript. -->
<template id="empty-posts">
  <div class="empty"><span class="symbol" aria-hidden="true">✎</span><h3>A blank page is a beginning</h3><p>Your words belong here. Start with one little thought.</p><button hidden data-owner-only data-action="new-post">Write the first page</button></div>
</template>
<template id="empty-blogs">
  <div class="empty"><span class="symbol" aria-hidden="true">✎</span><h3>A blank page is a beginning</h3><p>Longer thoughts and stories belong here.</p><button hidden data-owner-only data-action="new-blog">Write the first page</button></div>
</template>
<template id="empty-documents">
  <div class="empty"><span class="symbol" aria-hidden="true">▤</span><h3>Room for your materials</h3><p>Add a link to a lesson plan, worksheet, or resource.</p><button hidden data-owner-only data-action="new-document">Save a material</button></div>
</template>
<template id="empty-anime">
  <div class="empty"><span class="symbol" aria-hidden="true">☆</span><h3>Stories stay with us</h3><p>Keep your own thoughts, progress, and very personal ratings.</p><button hidden data-owner-only data-action="new-anime">Log your first anime</button></div>
</template>
<template id="empty-books">
  <p class="help">No stories on this shelf yet.</p>
</template>
<template id="no-results">
  <div class="empty"><span class="symbol" aria-hidden="true">✿</span><h3>No matching pages</h3><p>Try another word or filter.</p></div>
</template>
<template id="loading-template"><p class="help" data-message>Opening the page…</p></template>

<!-- Calendar day shape. Weekday headings and calendar frame are normal page HTML. -->
<template id="calendar-day"><button data-action="day"></button></template>
<template id="calendar-blank"><span aria-hidden="true"></span></template>

<!-- Dialog frame and form fields. Every input name matches a notebook data field. -->
<template id="dialog-template">
  <form>
    <div class="dialog-head">
      <h2 data-dialog-title></h2>
      <button type="button" data-action="close" aria-label="Close dialog">×</button>
    </div>
    <div data-dialog-body></div>
    <div class="dialog-actions">
      <button data-owner-only type="button" class="small" data-action="publication" hidden>Publish saved version</button>
      <button data-owner-only type="button" class="small" data-action="delete" hidden>Delete</button>
      <button type="button" data-action="close">Cancel</button>
      <button class="primary" type="submit">Save this page</button>
    </div>
  </form>
</template>

<template id="profile-fields">
  <div>
    <p class="help">Leave optional text empty to use the page’s default text.</p>
    <label>Profile visibility<select name="is_public"><option value="false">Private</option><option value="true">Public</option></select></label>
    <p class="help">Music of the Day is always visible to visitors. Only you can change it.</p>
    <label>Your name<input name="name" required></label>
    <label>A little introduction<textarea name="bio"></textarea></label>
    <label>Current status<input name="status"></label>
    <label>Welcome note<textarea name="intro"></textarea></label>
    <label>Currently watching<input name="watching"></label>
    <label>Currently playing<input name="playing"></label>
    <label>Currently doing<input name="doing"></label>
    <label>Music of the day — title<input name="song"></label>
    <label>Artist / credit<input name="artist"></label>
  </div>
</template>

<template id="interests-fields">
  <div>
    <label>Currently watching<input name="watching"></label>
    <label>Currently playing<input name="playing"></label>
    <label>Currently doing<input name="doing"></label>
  </div>
</template>

<template id="post-fields">
  <div>
    <label>Title<input name="title" required></label>
    <label>Date<input name="date" type="date" required></label>
    <label>Your words<textarea name="body" required></textarea></label>
    <label>Tags / little labels<input name="tags"></label>
  </div>
</template>

<template id="blog-fields">
  <div>
    <label>Title<input name="title" required></label>
    <label>Date<input name="date" type="date" required></label>
    <label>Shelf<select name="category"><option>Blog</option><option>Story</option></select></label>
    <label>Your words<textarea name="body" required></textarea></label>
    <label>Tags / little labels<input name="tags"></label>
  </div>
</template>

<template id="task-fields">
  <div>
    <label>Task<input name="title" required></label>
    <label>Notes<textarea name="note"></textarea></label>
    <label>Due date (optional)<input name="due" type="date"></label>
    <label>Progress<select name="status"><option>To do</option><option>In progress</option><option>Done</option></select></label>
  </div>
</template>

<template id="document-fields">
  <div>
    <label>Title<input name="title" required></label>
    <label>Material link (https://…)<input name="url" type="url" required></label>
    <label>Folder / subject<input name="folder"></label>
    <label>A little description<textarea name="note"></textarea></label>
  </div>
</template>

<template id="anime-fields">
  <div>
    <label>Anime title<input name="title" required></label>
    <label>Status<select name="status"><option>Watching</option><option>Completed</option><option>On hold</option><option>Plan to watch</option></select></label>
    <label>My rating<select name="rating"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label>
    <label>Episodes watched<input name="episodes" type="number" min="0" value="0"></label>
    <label>Log date<input name="date" type="date" required></label>
    <label>My thoughts<textarea name="body"></textarea></label>
    <label>Contains spoilers?<select name="spoilers"><option>No</option><option>Yes</option></select></label>
  </div>
</template>

<template id="reminder-fields">
  <div><div data-event-list></div><label>New reminder<input name="title" required></label></div>
</template>
<template id="reminder-template">
  <p><span data-field="title"></span> <button hidden data-owner-only type="button" class="small" data-action="delete-event">Remove</button></p>
</template>
<template id="confirmation-fields"><p data-confirm-message></p></template>

<template id="backup-template">
  <section>
    <div class="dialog-head"><h2>Keep a spare copy</h2><button data-action="close" aria-label="Close dialog">×</button></div>
    <p>Your notebook is stored on the server. Download a private backup of your active records, settings, and imported text novels. Trash is excluded; restore deleted records before exporting if you want to keep them.</p>
    <button hidden data-owner-only class="primary" data-action="export">Download a backup</button>
    <hr>
    <h3>Pages for the wider world</h3>
    <p class="help">This static export contains only your public profile and published entries/anime logs. Publishing on the server updates the live site automatically.</p>
    <button hidden data-owner-only data-action="export-public">Export public pages</button>
    <hr>
    <h3>Move your old notebook</h3>
    <button hidden data-owner-only data-action="legacy-export">Export old browser data</button>
    <label>Import source name<input id="import-source" value="legacy-browser" maxlength="80"></label>
    <label>Preview a Picture Book backup<input type="file" id="restore-file" accept="application/json,.json"></label>
    <p class="help">Import initializes an empty, unedited server notebook. It never replaces existing server records. Retry the same file with the same source name safely. Limit: 60 MiB per backup. Browser data is kept.</p>
    <div id="restore-preview"></div>
  </section>
</template>
<template id="restore-preview-template">
  <div><p data-restore-counts></p><button id="restore-confirm" class="primary">Import this preview</button></div>
</template>

<template id="trash-template">
  <section>
    <div class="dialog-head"><h2>Recover a page</h2><button data-action="close" aria-label="Close dialog">×</button></div>
    <label>Section<select id="trash-collection"><option value="posts">Daily notes</option><option value="blogs">Blogs and stories</option><option value="tasks">Tasks</option><option value="documents">Resource links</option><option value="anime">Anime logs</option><option value="events">Reminders</option><option value="books">Books</option></select></label>
    <div id="trash-list" aria-live="polite"></div>
    <p class="help">Restoring a published page makes it public again.</p>
    <button id="trash-prev">Previous</button><button id="trash-next">Next</button>
  </section>
</template>
<template id="trash-item-template">
  <p><span data-field="title"></span> <button data-restore-item>Restore</button></p>
</template>

<template id="weather-result">
  <div>
    <div class="weather"><span class="weather-icon" data-field="icon"></span><p><strong data-field="temperature"></strong> · <span data-field="label"></span><br><small data-field="updated"></small></p></div>
    <button class="small record-heading" data-action="weather-refresh">Refresh</button>
    <button class="small" data-action="weather-place">Change place</button>
  </div>
</template>
<template id="weather-error">
  <div><p class="help" data-field="message">The forecast is unavailable right now.</p><button class="small" data-action="weather-refresh">Try again</button><button class="small" data-action="weather-place">Choose place</button></div>
</template>
<template id="weather-place-fields">
  <div>
    <label>City or town<input name="place" required minlength="2" maxlength="100" placeholder="City or town name"></label>
    <p class="help">Search sends the place name to Open-Meteo. Choose the matching region and country. This choice lasts for this page visit.</p>
    <div id="weather-matches" aria-live="polite"></div>
  </div>
</template>
<template id="weather-place-result">
  <button type="button" class="small block"><span data-field="name"></span></button>
</template>
<template id="archive-error">
  <section class="paper"><p>The archive could not load. Start the local web server and try again.</p><a href="../data/changelog.json">Open the changelog file</a> · <a href="../README.md">Setup instructions</a></section>
</template>
